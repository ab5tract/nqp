# JVM backend build configuration for the Gradle build path.
# The values below mirror what Configure.pl recorded in config.status;
# override on the command line with -PnqpPrefix=... etc. if needed.
org.gradle.caching=true
org.gradle.parallel=true

nqpPrefix=/home/longwalker/code/raku/x.core/raku-prefix
javaLanguageVersion=25

# Truffle artifacts must match the GraalVM the JDK reports, not the nominal
# x.0.0 release: a mismatch shows up as Truffle.getRuntime() answering
# "Interpreted" (no partial evaluation at all) or an InternalError from
# LibGraal.initializeLibgraal.
truffleVersion=25.2.4
