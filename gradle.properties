# JVM backend build configuration for the Gradle build path.
# The values below mirror what Configure.pl recorded in config.status;
# override on the command line with -PnqpPrefix=... etc. if needed.
org.gradle.caching=true
org.gradle.parallel=true

# Gradle 8.14 cannot run on Java 25 (this machine's default JDK); pin the
# build JVM to the local JDK 21. The compile toolchain below is independent.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

nqpPrefix=/home/longwalker/code/raku/x.core/raku-prefix
javaLanguageVersion=21
